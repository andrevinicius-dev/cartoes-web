<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A2E">
<title>Cartões</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161B22;
    --desk:#1B2A2E;
    --desk-2:#22343A;
    --card:#FBF7EE;
    --card-edge:#E7DEC7;
    --brass:#C9973B;
    --brass-dim:#8f6c2b;
    --paper-text:#2A2416;
    --muted:#9FB3B0;
    --off:#EDEFEA;
    --err:#B4472F;
    --hard:#C98A3E;
    --good:#3F8F6E;
    --easy:#3E7C97;
    --radius:14px;
    --sat:env(safe-area-inset-top, 0px);
    --sab:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--desk);
    background-image:radial-gradient(circle at 15% 0%, var(--desk-2), var(--desk) 55%);
    color:var(--off);
    font-family:'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', Georgia, 'Times New Roman', serif;}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:none;flex-direction:column;padding-bottom:calc(24px + var(--sab));}
  #app.on{display:flex;}

  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(20px + var(--sat)) 18px 8px;
  }
  header.topbar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:0.2px;color:var(--off);}
  header.topbar h1 span{color:var(--brass);}
  .top-actions{display:flex;align-items:center;gap:2px;}
  .icon-btn{
    background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.07);color:var(--off);}
  #syncBtn[data-state=ok]{color:var(--good);}
  #syncBtn[data-state=pending]{color:var(--hard);}
  #syncBtn[data-state=err]{color:var(--err);}
  #syncBtn[data-state=busy]{color:var(--brass);animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;}}

  .deck-row{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 4px;scrollbar-width:none;}
  .deck-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);color:var(--off);font-size:14px;cursor:pointer;white-space:nowrap;
    transition:background .15s, border-color .15s;
  }
  .chip.active{background:var(--brass);color:#221a08;border-color:var(--brass);font-weight:600;}
  .chip.new{border-style:dashed;color:var(--muted);}

  main{flex:1;padding:12px 18px 0;}

  .empty{margin-top:60px;text-align:center;color:var(--muted);}
  .empty .serif{font-size:19px;color:var(--off);margin-bottom:6px;}

  .deck-header{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 6px;}
  .deck-header h2{margin:0;font-size:24px;font-weight:500;}
  .deck-stats{font-size:13px;color:var(--muted);}

  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 22px;}
  .action-btn{
    background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);
    border-radius:var(--radius);padding:16px 14px;text-align:left;cursor:pointer;color:var(--off);
    transition:transform .1s, background .15s;
  }
  .action-btn:active{transform:scale(0.97);}
  .action-btn .n{font-size:26px;font-weight:600;font-family:'Fraunces',Georgia,serif;display:block;}
  .action-btn .l{font-size:13px;color:var(--muted);}
  .action-btn.primary{background:var(--brass);color:#221a08;border-color:var(--brass);grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;}
  .action-btn.primary .n{color:#221a08;display:inline;margin-right:8px;}
  .action-btn.primary .l{color:#4a3712;}
  .action-btn.ai{background:linear-gradient(135deg, rgba(201,151,59,0.16), rgba(62,124,151,0.12));}
  .action-btn.wide{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;}
  .action-btn.wide .n{display:inline;margin-right:8px;font-size:22px;}

  .card-list-item{
    display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
    padding:13px 4px 13px 10px;border-bottom:1px solid rgba(255,255,255,0.07);
    border-left:3px solid transparent;
  }
  .card-list-item[data-rating="0"]{border-left-color:var(--err);}
  .card-list-item[data-rating="1"]{border-left-color:var(--hard);}
  .card-list-item[data-rating="2"]{border-left-color:var(--good);}
  .card-list-item[data-rating="3"]{border-left-color:var(--easy);}
  .card-list-item .front{font-size:14px;color:var(--off);}
  .card-list-item .due{font-size:12px;color:var(--muted);margin-top:3px;}
  .card-list-item .del{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px;}
  .card-list-item .del:hover{color:var(--err);}
  .rating-tag{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;display:inline-block;margin-top:4px;}
  .rating-tag.r0{background:rgba(180,71,47,0.18);color:var(--err);}
  .rating-tag.r1{background:rgba(201,138,62,0.18);color:var(--hard);}
  .rating-tag.r2{background:rgba(63,143,110,0.18);color:var(--good);}
  .rating-tag.r3{background:rgba(62,124,151,0.18);color:var(--easy);}
  .danger-link{display:block;margin:26px auto 0;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px;}
  .danger-link:hover{color:var(--err);}
  .link-btn{display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px;text-align:center;}
  .link-btn:hover{color:var(--brass);}

  /* Study mode */
  #study{position:fixed;inset:0;background:var(--desk);display:none;flex-direction:column;z-index:50;}
  #study.active{display:flex;}
  .study-top{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--sat)) 18px 16px;}
  .progress-track{flex:1;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin:0 14px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--brass);transition:width .25s;}
  .study-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .flashcard{
    width:100%;max-width:400px;min-height:260px;background:var(--card);color:var(--paper-text);
    border-radius:18px;padding:30px 26px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-family:'Fraunces',Georgia,serif;font-size:22px;line-height:1.4;
    box-shadow:0 20px 40px -12px rgba(0,0,0,0.5), 0 0 0 1px var(--card-edge);
    cursor:pointer;position:relative;
  }
  .flashcard .hint{position:absolute;bottom:14px;left:0;right:0;font-family:'Work Sans',system-ui,sans-serif;font-size:12px;color:#9c8f6d;font-weight:500;}
  .flashcard .back-label{position:absolute;top:16px;left:20px;font-family:'Work Sans',system-ui,sans-serif;font-size:11px;letter-spacing:0.4px;color:#9c8f6d;}
  .rate-row{display:none;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px calc(26px + var(--sab));}
  .rate-row.show{display:grid;}
  .rate-btn{border:none;border-radius:12px;padding:13px 6px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
  .rate-btn small{display:block;font-weight:400;opacity:0.85;font-size:11px;margin-top:2px;}
  .rate-btn.again{background:var(--err);}
  .rate-btn.hard{background:var(--hard);}
  .rate-btn.good{background:var(--good);}
  .rate-btn.easy{background:var(--easy);}
  .done-msg{text-align:center;color:var(--muted);}
  .done-msg .serif{font-size:22px;color:var(--off);}

  /* Login */
  #auth{position:fixed;inset:0;background:var(--desk);background-image:radial-gradient(circle at 15% 0%, var(--desk-2), var(--desk) 55%);
    display:none;align-items:center;justify-content:center;z-index:80;padding:24px;overflow-y:auto;}
  #auth.on{display:flex;}
  .auth-box{width:100%;max-width:380px;}
  .auth-box h1{margin:0 0 6px;font-size:34px;font-weight:600;}
  .auth-box h1 span{color:var(--brass);}
  .auth-sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 8px;}

  /* Modals */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(10,14,16,0.6);display:none;align-items:flex-end;z-index:60;}
  .sheet-backdrop.active{display:flex;}
  .sheet{
    width:100%;max-width:520px;margin:0 auto;background:var(--desk-2);border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + var(--sab));max-height:88vh;overflow-y:auto;
    animation:up .2s ease-out;
  }
  @keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{margin:0 0 4px;font-size:20px;font-weight:500;}
  .sheet .sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
  .sheet .section{margin-top:26px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08);}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
  input[type=text], input[type=email], input[type=password], textarea, select{
    width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);
    color:var(--off);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;resize:vertical;
  }
  select option{background:var(--desk-2);color:var(--off);}
  textarea{min-height:120px;line-height:1.4;}
  input::placeholder, textarea::placeholder{color:#5f6f6c;}
  .row-btns{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn.solid{background:var(--brass);color:#221a08;}
  .btn.ghost{background:rgba(255,255,255,0.06);color:var(--off);}
  .btn.small{flex:none;padding:9px 14px;font-size:13px;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .err-box{background:rgba(180,71,47,0.15);border:1px solid rgba(180,71,47,0.4);color:#f2a993;
    border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;display:none;line-height:1.45;}
  .err-box.show{display:block;}
  .hint-box{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;font-size:12.5px;
    color:var(--muted);line-height:1.5;margin-top:14px;}
  .hint-box a{color:var(--brass);}
  .preview-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}
  .preview-item{background:rgba(255,255,255,0.05);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start;}
  .preview-item .qa{flex:1;}
  .preview-item .qa .q{color:var(--off);margin-bottom:3px;}
  .preview-item .qa .a{color:var(--muted);}
  .spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,0.2);border-top-color:#221a08;border-radius:50%;
    animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <h1>Cart<span>õ</span>es</h1>
    <div class="top-actions">
      <button class="icon-btn" id="syncBtn" data-state="pending" onclick="sync()" aria-label="Sincronizar com a nuvem" title="Sincronizar">☁</button>
      <button class="icon-btn" onclick="openSettings()" aria-label="Configurações">⚙</button>
    </div>
  </header>

  <div class="deck-row" id="deckRow"></div>

  <main id="main"></main>
</div>

<!-- Study overlay -->
<div id="study">
  <div class="study-top">
    <button class="icon-btn" onclick="exitStudy()" aria-label="Sair do estudo">✕</button>
    <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <span style="font-size:13px;color:var(--muted);min-width:38px;text-align:right;" id="progCount"></span>
  </div>
  <div class="study-stage" id="studyStage"></div>
  <div class="rate-row" id="rateRow">
    <button class="rate-btn again" onclick="rate(0)">Errei<small>&lt;1d</small></button>
    <button class="rate-btn hard" onclick="rate(1)">Difícil<small id="hardPreview"></small></button>
    <button class="rate-btn good" onclick="rate(2)">Bom<small id="goodPreview"></small></button>
    <button class="rate-btn easy" onclick="rate(3)">Fácil<small id="easyPreview"></small></button>
  </div>
</div>

<!-- Login -->
<div id="auth">
  <div class="auth-box" id="authBox">
    <h1>Cart<span>õ</span>es</h1>
    <p class="auth-sub" id="authSub">Entre na sua conta para ter seus baralhos em qualquer aparelho.</p>
    <label for="authEmail">E-mail</label>
    <input type="email" id="authEmail" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="voce@exemplo.com">
    <label for="authPass">Senha</label>
    <input type="password" id="authPass" autocomplete="current-password" placeholder="mínimo de 6 caracteres">
    <div class="err-box" id="authErr"></div>
    <div class="row-btns">
      <button class="btn ghost" id="btnSignUp" onclick="doAuth('signup')">Criar conta</button>
      <button class="btn solid" id="btnSignIn" onclick="doAuth('signin')">Entrar</button>
    </div>
  </div>
</div>

<!-- Generic bottom sheet backdrop -->
<div class="sheet-backdrop" id="backdrop" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheetContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // Mesma base de dados do app Android — dados ficam na nuvem, não no navegador.
  window.APP_CONFIG = {
    SUPABASE_URL: "https://dfsvtaapyqrkmsvgbwxy.supabase.co",
    SUPABASE_ANON_KEY: "sb_publishable_khpOfvZEf6uIPBb6q9kl9g_IZVAaNvi"
  };
</script>
<script>
/* =====================================================================
   Cartões — flashcards com repetição espaçada (SM-2)
   Dados: guardados no aparelho (cache) e sincronizados com o Supabase.
   Modelo "local primeiro": tudo funciona offline e sobe para a nuvem
   quando houver internet. Conflitos: vence a alteração mais recente.
   ===================================================================== */
const DEFAULT_MODEL = 'claude-haiku-4-5-20251001';
const MODELS = [
  { id: 'claude-haiku-4-5-20251001', label: 'Claude Haiku 4.5 (mais barato)' },
  { id: 'claude-sonnet-5',           label: 'Claude Sonnet 5 (mais capaz)' }
];
const EPOCH = '1970-01-01T00:00:00Z';
const LAST_USER_KEY = 'cartoes_last_user';
const CFG = window.APP_CONFIG || {};
const configured = /^https?:\/\//.test(CFG.SUPABASE_URL || '') &&
                   (CFG.SUPABASE_ANON_KEY || '').length > 20 &&
                   !/COLE_AQUI/.test((CFG.SUPABASE_URL || '') + (CFG.SUPABASE_ANON_KEY || ''));

const $ = id => document.getElementById(id);

/* ---------- Estado ---------- */
let sb = null, userId = null, userEmail = '';
let S = emptyState();
let currentDeckId = null;
let studyQueue = [], studyIndex = 0, flipped = false, currentRatingCard = null;
let syncing = false, syncAgain = false, syncTimer = null, syncLabel = 'Aguardando sincronização';

function emptyState(){
  return {
    decks: [],   // {id, name, deleted, updated, dirty}
    cards: [],   // {id, deck_id, front, back, due, interval, reps, ease, deleted, updated, dirty}
    settings: { apiKey: '', model: DEFAULT_MODEL, updated: 0, dirty: false },
    lastPull: { decks: EPOCH, cards: EPOCH, user_settings: EPOCH }
  };
}
function cacheKey(){ return 'cartoes_v2_' + userId; }
function loadLocal(){
  S = emptyState();
  try{
    const raw = localStorage.getItem(cacheKey());
    if(!raw) return;
    const p = JSON.parse(raw), base = emptyState();
    S = Object.assign(base, p);
    S.settings = Object.assign(emptyState().settings, p.settings || {});
    S.lastPull = Object.assign(emptyState().lastPull, p.lastPull || {});
    if(!Array.isArray(S.decks)) S.decks = [];
    if(!Array.isArray(S.cards)) S.cards = [];
  }catch(e){ S = emptyState(); }
}
function persist(){ try{ localStorage.setItem(cacheKey(), JSON.stringify(S)); }catch(e){} }
function save(){ persist(); scheduleSync(); }
function touch(o){ o.updated = Math.max(Date.now(), (o.updated || 0) + 1); o.dirty = true; }

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0; return (c==='x' ? r : (r&0x3|0x8)).toString(16);
  });
}
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function daysUntil(ts){ return Math.max(1, Math.ceil(((ts||0)-Date.now())/86400000)); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const liveDecks = () => S.decks.filter(d => !d.deleted);
const liveCards = deckId => S.cards.filter(c => c.deck_id === deckId && !c.deleted);
const dueCards  = deckId => liveCards(deckId).filter(c => (c.due || 0) <= Date.now());
const pendingCount = () => S.decks.filter(x=>x.dirty).length + S.cards.filter(x=>x.dirty).length + (S.settings.dirty ? 1 : 0);

/* ---------- Sincronização com o Supabase ---------- */
function setSync(state, text){
  syncLabel = text;
  const b = $('syncBtn');
  if(b){ b.dataset.state = state; b.title = text; }
  const t = $('syncText'); if(t) t.textContent = text;
}
function scheduleSync(delay){
  if(!sb || !userId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, delay == null ? 1500 : delay);
}
function isAuthError(e){
  return !!e && (e.status === 401 || e.code === 'PGRST301' || e.code === 'PGRST303' || e.name === 'AuthSessionMissingError');
}

async function sync(){
  if(!sb || !userId) return;
  if(!navigator.onLine){
    setSync(pendingCount() ? 'pending' : 'ok', pendingCount() ? 'Sem internet — envio pendente' : 'Sem internet');
    return;
  }
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  setSync('busy', 'Sincronizando…');
  let changed = false;
  try{
    changed = await pull();
    await push();
    persist();
    const hh = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    setSync('ok', 'Sincronizado às ' + hh);
  }catch(e){
    console.error('sync', e);
    persist();
    if(isAuthError(e)){
      setSync('err', 'Sessão expirada — entre novamente');
      showAuth('Sua sessão expirou. Entre de novo para continuar sincronizando.');
    }else{
      setSync('err', 'Falha ao sincronizar: ' + ((e && e.message) || 'tente de novo'));
    }
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; scheduleSync(300); }
  }
  if(changed && !$('study').classList.contains('active')) render();
  else if(!liveDecks().length) render();
}

async function fetchNew(table, since, orderKey){
  const rows = [], step = 1000;
  let from = 0;
  for(;;){
    const { data, error } = await sb.from(table).select('*')
      .gt('synced_at', since)
      .order('synced_at', { ascending: true })
      .order(orderKey, { ascending: true })
      .range(from, from + step - 1);
    if(error) throw error;
    rows.push(...data);
    if(data.length < step) break;
    from += step;
  }
  return rows;
}
function mergeList(list, rows, fromRow){
  const idx = new Map(list.map((x, i) => [x.id, i]));
  let changed = false;
  for(const r of rows){
    const inc = fromRow(r), i = idx.get(inc.id);
    if(i === undefined){ idx.set(inc.id, list.length); list.push(inc); changed = true; }
    else if(inc.updated > list[i].updated){ list[i] = inc; changed = true; }
  }
  return changed;
}
const deckFromRow = r => ({ id: r.id, name: r.name, deleted: !!r.deleted, updated: Number(r.updated_at), dirty: false });
const cardFromRow = r => ({
  id: r.id, deck_id: r.deck_id, front: r.front, back: r.back,
  due: Number(r.due), interval: Number(r.interval_days), reps: Number(r.reps), ease: Number(r.ease),
  lastRating: (r.last_rating === null || r.last_rating === undefined) ? undefined : Number(r.last_rating),
  deleted: !!r.deleted, updated: Number(r.updated_at), dirty: false
});
async function pull(){
  const d = await fetchNew('decks', S.lastPull.decks, 'id');
  const c = await fetchNew('cards', S.lastPull.cards, 'id');
  const s = await fetchNew('user_settings', S.lastPull.user_settings, 'user_id');
  let changed = false;
  if(mergeList(S.decks, d, deckFromRow)) changed = true;
  if(mergeList(S.cards, c, cardFromRow)) changed = true;
  if(s.length){
    const r = s[s.length - 1];
    if(Number(r.updated_at) > S.settings.updated){
      S.settings = { apiKey: r.anthropic_key || '', model: r.model || DEFAULT_MODEL, updated: Number(r.updated_at), dirty: false };
      changed = true;
    }
  }
  if(d.length) S.lastPull.decks = d[d.length-1].synced_at;
  if(c.length) S.lastPull.cards = c[c.length-1].synced_at;
  if(s.length) S.lastPull.user_settings = s[s.length-1].synced_at;
  return changed;
}
const deckRow = d => ({ id: d.id, user_id: userId, name: d.name, deleted: !!d.deleted, updated_at: d.updated });
const cardRow = c => ({
  id: c.id, user_id: userId, deck_id: c.deck_id, front: c.front, back: c.back,
  due: Math.round(c.due || 0), interval_days: Math.round(c.interval || 0), reps: Math.round(c.reps || 0),
  ease: c.ease || 2.5, last_rating: (c.lastRating === undefined || c.lastRating === null) ? null : c.lastRating,
  deleted: !!c.deleted, updated_at: c.updated
});
async function pushList(table, list, toRow){
  const dirty = list.filter(x => x.dirty);
  for(let i = 0; i < dirty.length; i += 200){
    const chunk = dirty.slice(i, i + 200);
    const sent = chunk.map(x => x.updated);
    const { error } = await sb.from(table).upsert(chunk.map(toRow), { onConflict: 'id' });
    if(error) throw error;
    chunk.forEach((x, k) => { if(x.updated === sent[k]) x.dirty = false; });
  }
}
async function push(){
  await pushList('decks', S.decks, deckRow);      // baralhos antes dos cartões (chave estrangeira)
  await pushList('cards', S.cards, cardRow);
  if(S.settings.dirty){
    const sent = S.settings.updated;
    const { error } = await sb.from('user_settings').upsert({
      user_id: userId, anthropic_key: S.settings.apiKey || '', model: S.settings.model || DEFAULT_MODEL, updated_at: sent
    }, { onConflict: 'user_id' });
    if(error) throw error;
    if(S.settings.updated === sent) S.settings.dirty = false;
  }
}

/* ---------- Login ---------- */
function showAuth(msg){
  $('app').classList.remove('on');
  $('study').classList.remove('active');
  closeSheet();
  $('auth').classList.add('on');
  $('authPass').value = '';
  const err = $('authErr');
  if(msg){ err.textContent = msg; err.classList.add('show'); } else err.classList.remove('show');
}
function showAuthErr(msg){ const e = $('authErr'); e.textContent = msg; e.classList.add('show'); }
function setAuthBusy(b){ $('btnSignIn').disabled = b; $('btnSignUp').disabled = b; }
function translateAuthError(e){
  const m = (e && e.message) || String(e);
  if(/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/already registered|already been registered/i.test(m)) return 'Esse e-mail já tem conta. Toque em Entrar.';
  if(/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Confirme pelo link enviado ou desative a confirmação no Supabase.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com a internet.';
  if(/password/i.test(m) && /6/.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m)) return 'Muitas tentativas seguidas. Aguarde alguns minutos.';
  return m;
}
async function doAuth(mode){
  const email = $('authEmail').value.trim(), password = $('authPass').value;
  $('authErr').classList.remove('show');
  if(!email || !password){ showAuthErr('Preencha e-mail e senha.'); return; }
  if(mode === 'signup' && password.length < 6){ showAuthErr('A senha precisa ter pelo menos 6 caracteres.'); return; }
  setAuthBusy(true);
  try{
    let res;
    if(mode === 'signup'){
      res = await sb.auth.signUp({ email, password });
      if(res.error) throw res.error;
      if(!res.data.session){
        showAuthErr('Conta criada, mas o Supabase pediu confirmação por e-mail. Desative "Confirm email" no painel ou confirme pelo link enviado e toque em Entrar.');
        return;
      }
    }else{
      res = await sb.auth.signInWithPassword({ email, password });
      if(res.error) throw res.error;
    }
    await startSession(res.data.user);
  }catch(e){
    showAuthErr(translateAuthError(e));
  }finally{
    setAuthBusy(false);
  }
}
async function signOut(){
  if(pendingCount() > 0 && !confirm('Há alterações que ainda não foram enviadas para a nuvem. Sair mesmo assim? Elas serão perdidas.')) return;
  try{ await sb.auth.signOut(); }catch(e){}
  try{ localStorage.removeItem(cacheKey()); localStorage.removeItem(LAST_USER_KEY); }catch(e){}
  userId = null; userEmail = ''; S = emptyState(); currentDeckId = null;
  closeSheet();
  showAuth();
}
async function startSession(user){
  userId = user.id; userEmail = user.email || '';
  try{ localStorage.setItem(LAST_USER_KEY, JSON.stringify({ id: userId, email: userEmail })); }catch(e){}
  loadLocal();
  currentDeckId = liveDecks()[0] ? liveDecks()[0].id : null;
  $('auth').classList.remove('on');
  $('app').classList.add('on');
  sync();          // liga o estado "sincronizando" antes do primeiro desenho
  render();
}

/* ---------- Desenho da tela ---------- */
function ensureDeck(){
  let d = S.decks.find(x => x.id === currentDeckId && !x.deleted);
  if(!d){ d = liveDecks()[0] || null; currentDeckId = d ? d.id : null; }
  return d;
}
function render(){
  ensureDeck();
  renderDeckRow();
  renderMain();
}
function renderDeckRow(){
  const row = $('deckRow');
  row.innerHTML = '';
  liveDecks().forEach(d=>{
    const c = document.createElement('button');
    c.className = 'chip' + (d.id === currentDeckId ? ' active' : '');
    c.textContent = d.name;
    c.onclick = ()=>{ currentDeckId = d.id; render(); };
    row.appendChild(c);
  });
  const add = document.createElement('button');
  add.className = 'chip new';
  add.textContent = '+ baralho';
  add.onclick = openNewDeck;
  row.appendChild(add);
}
function renderMain(){
  const main = $('main');
  const deck = ensureDeck();
  if(!deck){
    main.innerHTML = syncing
      ? `<div class="empty"><div class="serif">Buscando seus baralhos…</div><div>Sincronizando com a nuvem.</div></div>`
      : `<div class="empty"><div class="serif">Nenhum baralho ainda</div><div>Toque em “+ baralho” para criar o primeiro.</div></div>`;
    return;
  }
  const cards = liveCards(deck.id);
  const due = cards.filter(c => (c.due || 0) <= Date.now());
  main.innerHTML = `
    <div class="deck-header">
      <h2>${escapeHtml(deck.name)}</h2>
      <span class="deck-stats">${cards.length} cartões</span>
    </div>
    <div class="action-grid">
      <div class="action-btn primary" onclick="startStudy()">
        <div><span class="n">${due.length}</span><span class="l">para revisar hoje</span></div>
        <span style="font-size:22px;">▶</span>
      </div>
      ${cards.length > due.length ? `<button class="link-btn" style="grid-column:1 / -1;margin:-6px 0 4px;" onclick="startStudy(true)">ou estude os ${cards.length} cartões do baralho, sem esperar a data</button>` : ''}
      <div class="action-btn" onclick="openNewCard()">
        <span class="n">+</span><span class="l">Novo cartão</span>
      </div>
      <div class="action-btn" onclick="openPasteCards()">
        <span class="n">⎘</span><span class="l">Colar cartões</span>
      </div>
      <div class="action-btn ai wide" onclick="openAiGenerate()">
        <div><span class="n">✦</span><span class="l">Gerar com IA (chave de API)</span></div>
      </div>
    </div>
    <div id="cardList"></div>
  `;
  const list = $('cardList');
  if(cards.length === 0){
    list.innerHTML = `<div class="empty" style="margin-top:20px;">Adicione cartões manualmente ou gere com IA a partir de um texto.</div>`;
  }else{
    const ratingLabels = ['Errei','Difícil','Bom','Fácil'];
    cards.slice().sort((a,b)=>(a.due||0)-(b.due||0)).forEach(c=>{
      const item = document.createElement('div');
      item.className = 'card-list-item';
      if(c.lastRating !== undefined && c.lastRating !== null) item.dataset.rating = c.lastRating;
      const dueTxt = (c.due||0) <= Date.now() ? 'pronto para revisar' : 'revisar em ' + daysUntil(c.due) + 'd';
      const tagHtml = (c.lastRating !== undefined && c.lastRating !== null)
        ? `<span class="rating-tag r${c.lastRating}">${ratingLabels[c.lastRating]}</span>`
        : '';
      item.innerHTML = `<div><div class="front">${escapeHtml(c.front)}</div><div class="due">${dueTxt}</div>${tagHtml}</div>
        <button class="del" onclick="deleteCard('${c.id}')">excluir</button>`;
      list.appendChild(item);
    });
  }
  list.insertAdjacentHTML('afterend', `<button class="danger-link" onclick="deleteDeck('${deck.id}')">Excluir este baralho</button>`);
}

/* ---------- Estudo / SM-2 ---------- */
function startStudy(all){
  studyQueue = shuffle(all ? liveCards(currentDeckId) : dueCards(currentDeckId));
  studyIndex = 0;
  if(studyQueue.length === 0) return;
  $('study').classList.add('active');
  showCurrentCard();
}
function exitStudy(){
  $('study').classList.remove('active');
  render();
}
function showCurrentCard(){
  flipped = false;
  const stage = $('studyStage');
  $('rateRow').classList.remove('show');
  $('progFill').style.width = (studyIndex / studyQueue.length * 100) + '%';
  $('progCount').textContent = studyIndex + '/' + studyQueue.length;

  if(studyIndex >= studyQueue.length){
    stage.innerHTML = `<div class="done-msg"><div class="serif">Tudo revisado ✦</div><div>Volte mais tarde para a próxima leva.</div></div>`;
    setTimeout(exitStudy, 1400);
    return;
  }
  const c = studyQueue[studyIndex];
  currentRatingCard = c;
  stage.innerHTML = `<div class="flashcard" onclick="flipCard()">
      <div>${escapeHtml(c.front)}</div>
      <div class="hint">toque para virar</div>
    </div>`;
}
function flipCard(){
  if(flipped) return;
  flipped = true;
  const c = currentRatingCard;
  $('studyStage').innerHTML = `<div class="flashcard">
      <div class="back-label">RESPOSTA</div>
      <div>${escapeHtml(c.back)}</div>
    </div>`;
  $('hardPreview').textContent = previewInterval(c, 1);
  $('goodPreview').textContent = previewInterval(c, 2);
  $('easyPreview').textContent = previewInterval(c, 3);
  $('rateRow').classList.add('show');
}
function previewInterval(card, rating){
  const tmp = Object.assign({}, card);
  scheduleCard(tmp, rating);
  const d = Math.round((tmp.due - Date.now()) / 86400000);
  return d <= 0 ? '<1d' : d + 'd';
}
function scheduleCard(card, rating){
  // Espaçamento fixo em 2 etapas: cartão novo que você erra volta em 7 dias;
  // qualquer cartão que já passou dessa primeira revisão (ou que você já acertou
  // de primeira) passa a ser revisado sempre a cada 30 dias, acertando ou errando.
  card.lastRating = rating;
  card.reps = (card.reps || 0) + 1;
  if((card.interval || 0) < 7){
    card.interval = (rating === 0) ? 7 : 30;
  }else{
    card.interval = 30;
  }
  card.due = Date.now() + card.interval * 86400000;
}
function rate(rating){
  const card = S.cards.find(c => c.id === currentRatingCard.id);
  if(card){ scheduleCard(card, rating); touch(card); save(); }
  studyIndex++;
  showCurrentCard();
}

async function exportBackup(){
  const out = {
    version: 2,
    exportedAt: new Date().toISOString(),
    decks: liveDecks().map(d => ({
      id: d.id, name: d.name,
      cards: liveCards(d.id).map(c => ({ id: c.id, front: c.front, back: c.back, due: c.due, interval: c.interval, reps: c.reps, ease: c.ease }))
    })),
    settings: { model: S.settings.model }
  };
  const date = new Date().toISOString().slice(0, 10);
  const name = `cartoes-backup-${date}.json`;
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  try{
    const file = new File([blob], name, { type: 'application/json' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Backup dos Cartões' });
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importBackup(file){
  const errBox = $('settingsErr');
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const imp = JSON.parse(e.target.result);
      if(!imp || !Array.isArray(imp.decks)) throw new Error('Arquivo inválido.');
      let nd = 0, nc = 0;
      imp.decks.forEach(d => {
        const deck = { id: uid(), name: String(d.name || 'Importado'), deleted: false, updated: 0, dirty: true };
        touch(deck); S.decks.push(deck); nd++;
        (d.cards || []).forEach(c => {
          if(!c || !c.front || !c.back) return;
          const card = {
            id: uid(), deck_id: deck.id, front: String(c.front), back: String(c.back),
            due: Number(c.due) || 0, interval: parseInt(c.interval, 10) || 0, reps: parseInt(c.reps, 10) || 0,
            ease: Number(c.ease) || 2.5, deleted: false, updated: 0, dirty: true
          };
          touch(card); S.cards.push(card); nc++;
        });
      });
      if(imp.settings && imp.settings.apiKey && !S.settings.apiKey){
        S.settings.apiKey = String(imp.settings.apiKey); touch(S.settings);
      }
      save();
      ensureDeck();
      render();
      showSheet(`
        <h3>Backup importado</h3>
        <div class="sub">${nd} baralho(s) e ${nc} cartão(ões) adicionados. Eles já estão subindo para a nuvem.</div>
        <div class="row-btns"><button class="btn solid" onclick="closeSheet()">Ok</button></div>
      `);
    }catch(err){
      errBox.textContent = 'Não consegui importar: ' + err.message;
      errBox.classList.add('show');
    }
  };
  reader.readAsText(file);
}

async function generateFlashcards(){
  const text = $('aiText').value.trim();
  const errBox = $('aiErr');
  const btn = $('aiGenBtn');
  errBox.classList.remove('show');
  if(!text){ errBox.textContent = 'Cole algum texto primeiro.'; errBox.classList.add('show'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Gerando...';

  const prompt = `A partir do texto abaixo, crie entre 8 e 15 flashcards de pergunta e resposta em português, cobrindo os conceitos e fatos mais importantes para estudo (estilo Anki: perguntas objetivas, respostas curtas e diretas).
Responda APENAS com um array JSON válido, sem markdown, sem crases, sem nenhum texto antes ou depois, no formato exato:
[{"front":"pergunta","back":"resposta"}]

Texto:
"""${text}"""`;

  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': S.settings.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: S.settings.model || DEFAULT_MODEL,
        max_tokens: 2000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if(!res.ok){
      const errText = await res.text();
      throw new Error('A API retornou erro (' + res.status + '). Verifique sua chave e o modelo. Detalhe: ' + errText.slice(0, 180));
    }
    const json = await res.json();
    let raw = (json.content && json.content[0] && json.content[0].text) || '';
    const a = raw.indexOf('['), b = raw.lastIndexOf(']');
    if(a >= 0 && b > a) raw = raw.slice(a, b + 1);
    const cards = JSON.parse(raw);
    if(!Array.isArray(cards) || cards.length === 0) throw new Error('Não consegui interpretar a resposta da IA.');
    showAiPreview(cards);
  }catch(e){
    errBox.textContent = e.message || 'Falha ao gerar cartões. Verifique sua conexão e chave de API.';
    errBox.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Gerar cartões';
  }
}
function showAiPreview(cards, opts){
  opts = opts || {};
  const title = opts.title || (cards.length + ' cartões gerados');
  const sub = opts.sub || 'Revise e desmarque o que não quiser adicionar.';
  window.__aiCards = cards;
  const listHtml = cards.map((c, i) => `
    <div class="preview-item">
      <input type="checkbox" checked data-idx="${i}" class="aiCheck" aria-label="Adicionar cartão ${i + 1}">
      <div class="qa"><div class="q">${escapeHtml(c.front)}</div><div class="a">${escapeHtml(c.back)}</div></div>
    </div>`).join('');
  showSheet(`
    <h3>${escapeHtml(title)}</h3>
    <div class="sub">${escapeHtml(sub)}</div>
    <div class="preview-list">${listHtml}</div>
    <div class="row-btns">
      <button class="btn ghost" onclick="closeSheet()">Descartar</button>
      <button class="btn solid" onclick="confirmAiCards()">Adicionar ao baralho</button>
    </div>
  `);
}
function confirmAiCards(){
  document.querySelectorAll('.aiCheck').forEach(chk => {
    if(chk.checked){
      const c = window.__aiCards[chk.dataset.idx];
      if(c && c.front && c.back) addCardToDeck(currentDeckId, String(c.front), String(c.back));
    }
  });
  save();
  closeSheet();
  render();
}

/* ---------- Colar cartões (feitos por você ou pelo Claude no chat) ---------- */
const PASTE_PROMPT = 'Crie flashcards em português sobre o assunto abaixo. Responda só com as linhas, uma por cartão, no formato exato: pergunta | resposta. Sem numeração, sem cabeçalho, sem tabela e sem explicações. Perguntas objetivas e respostas curtas.\n\nAssunto: ';

function openPasteCards(){
  showSheet(`
    <h3>Colar cartões</h3>
    <div class="sub">Cole uma linha por cartão, no formato <b>pergunta | resposta</b>. Serve para textos gerados pelo Claude no chat.</div>
    <textarea id="pasteText" placeholder="Qual a capital da França? | Paris&#10;Quem escreveu Dom Casmurro? | Machado de Assis" style="min-height:160px;"></textarea>
    <div class="err-box" id="pasteErr"></div>
    <div class="hint-box">
      <div style="margin-bottom:8px;">Instrução pronta para colar no chat do Claude (troque o assunto no final):</div>
      <div id="promptText" style="color:var(--off);white-space:pre-wrap;">${escapeHtml(PASTE_PROMPT)}</div>
      <button class="btn ghost small" id="copyBtn" style="margin-top:10px;" onclick="copyPrompt()">Copiar instrução</button>
    </div>
    <div class="row-btns">
      <button class="btn ghost" onclick="closeSheet()">Cancelar</button>
      <button class="btn solid" onclick="reviewPaste()">Revisar cartões</button>
    </div>
  `);
}
async function copyPrompt(){
  const btn = $('copyBtn');
  try{
    await navigator.clipboard.writeText(PASTE_PROMPT);
    btn.textContent = 'Copiado ✓';
  }catch(e){
    const el = $('promptText');
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = 'Selecionado — toque em copiar';
  }
}
function parsePastedCards(text){
  const cards = []; let skipped = 0;
  String(text || '').split(/\r?\n/).forEach(raw => {
    let line = raw.trim();
    if(!line) return;
    if(/^[\s|:\-]+$/.test(line)) return;                       // linha separadora de tabela markdown
    line = line.replace(/^(?:[-*•]|\d+[.)])\s+/, '');          // marcador ou numeração no começo
    if(line.startsWith('|')) line = line.replace(/^\|/, '').replace(/\|\s*$/, '');   // tabela: | a | b |
    let parts;
    if(line.includes('|')) parts = line.split('|');
    else if(line.includes('\t')) parts = line.split('\t');     // formato do Anki / planilhas
    else { skipped++; return; }
    parts = parts.map(s => s.replace(/\*\*/g, '').trim());
    const front = parts.shift();
    const back = parts.filter(Boolean).join(' | ');
    if(!front || !back){ skipped++; return; }
    cards.push({ front, back });
  });
  if(cards.length && /^(pergunta|frente|front|question)$/i.test(cards[0].front) && /^(resposta|verso|back|answer)$/i.test(cards[0].back)) cards.shift();
  return { cards, skipped };
}
function reviewPaste(){
  const { cards, skipped } = parsePastedCards($('pasteText').value);
  const err = $('pasteErr');
  if(!cards.length){
    err.textContent = 'Não encontrei nenhum cartão. Use uma linha por cartão, no formato: pergunta | resposta';
    err.classList.add('show');
    return;
  }
  showAiPreview(cards, {
    title: cards.length + (cards.length === 1 ? ' cartão encontrado' : ' cartões encontrados'),
    sub: skipped ? skipped + ' linha(s) sem o separador "|" foram ignoradas. Revise e desmarque o que não quiser.' : 'Revise e desmarque o que não quiser adicionar.'
  });
}

/* ---------- Início ---------- */
function showConfigError(){
  $('auth').classList.add('on');
  $('authBox').innerHTML = `
    <h1>Cart<span>õ</span>es</h1>
    <div class="err-box show">Falta configurar o Supabase nesta página.</div>`;
}
async function init(){
  if(!configured){ showConfigError(); return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });
  let session = null;
  try{ const r = await sb.auth.getSession(); session = r.data && r.data.session; }catch(e){}
  if(session){ await startSession(session.user); }
  else{
    let last = null;
    try{ last = JSON.parse(localStorage.getItem(LAST_USER_KEY) || 'null'); }catch(e){}
    if(last && last.id && !navigator.onLine){ await startSession(last); }   // abre offline com os dados do aparelho
    else showAuth();
  }
  window.addEventListener('online', () => scheduleSync(500));
  document.addEventListener('visibilitychange', () => { if(!document.hidden) scheduleSync(500); });
  setInterval(() => { if(!document.hidden) scheduleSync(0); }, 90000);
}
init();
